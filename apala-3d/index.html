<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apala chrom – model 3D</title>
<style>
  :root{--ink:#e9ebee;--glass:rgba(58,61,66,.78);--line:rgba(255,255,255,.14)}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 40%,#3d4045 0%,#2a2c30 55%,#1b1c1f 100%)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .title{position:fixed;top:14px;left:16px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .title b{display:block;font-size:18px;letter-spacing:.02em}
  .title > span{font-size:12px;opacity:.9}
  .bar{position:fixed;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
  button,.sl{font:600 13px/1 inherit;font-family:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(8px)}
  button:hover{background:rgba(80,84,90,.9)}
  button[aria-pressed="true"]{background:#e9ebee;color:#1d2024;border-color:rgba(0,0,0,.35);box-shadow:0 1px 6px rgba(0,0,0,.35)}
  .sl{display:flex;gap:8px;align-items:center;cursor:default}
  .sl input{width:110px}
  .sw{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;margin-bottom:4px}
  .sw button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;background:none;border:0;
    backdrop-filter:none;font:500 11px/1.1 inherit;font-family:inherit;color:#c9ccd1;width:64px}
  .sw button:hover{background:none;color:#fff}
  .sw i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-shadow:inset 0 -3px 6px rgba(0,0,0,.35)}
  .sw button[aria-pressed="true"]{background:none;color:#fff}
  .sw button[aria-pressed="true"] i{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.35)}
  .hint{position:fixed;top:14px;right:16px;color:#fff;font-size:12px;text-align:right;text-shadow:0 1px 6px rgba(0,0,0,.35);max-width:240px}
  .loading{position:fixed;inset:0;display:grid;place-items:center;color:#c9ccd1;font-size:14px;pointer-events:none}
  @media (max-width:600px){.hint{display:none}
    .sw{gap:6px}.sw button{width:38px;font-size:0;gap:0}.sw i{width:30px;height:30px}
    button,.sl{padding:8px 11px;font-size:12px}.bar{gap:6px;bottom:12px}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><b>Blue Water Apala – <span id="fname">chrom</span></b><span>Model 3D na podstawie geometrii producenta</span></div>
<div id="loading" class="loading">Wczytywanie modelu…</div>
<div class="hint">Przeciągnij – obrót · kółko – zoom<br>prawy przycisk – przesuwanie</div>
<div class="bar">
  <div class="sw" id="swatches"></div>
  <button data-v="front">Przód</button>
  <button data-v="right">Prawa</button>
  <button data-v="back">Tył</button>
  <button data-v="left">Lewa</button>
  <button data-v="top">Góra</button>
  <button id="bAuto" aria-pressed="true">Auto-obrót</button>
  <button id="bWater" aria-pressed="false">Woda</button>
  <button id="bSlab" aria-pressed="true">Blat</button>
  <label class="sl">Wylewka <input id="swing" type="range" min="0" max="360" value="0"><span id="swv">0°</span></label>
  <label class="sl">Rączka <input id="tilt" type="range" min="-25" max="25" value="0"><span id="tlv">0°</span></label>
  <button id="bGlb">Pobierz GLB</button>
</div>

const canvas = document.getElementById('c');

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
// jasne "studio" do odbić w chromie: gradientowa kopuła + softboxy
function studio(){
  const s = new THREE.Scene();
  const gc = document.createElement('canvas'); gc.width = 4; gc.height = 256;
  const g = gc.getContext('2d'), grad = g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'#d8dbe0'); grad.addColorStop(0.42,'#8d9197'); grad.addColorStop(0.52,'#2b2d30'); grad.addColorStop(0.64,'#6f7378'); grad.addColorStop(1,'#c6c9cd');
  g.fillStyle = grad; g.fillRect(0,0,4,256);
  const tex = new THREE.CanvasTexture(gc); tex.colorSpace = THREE.SRGBColorSpace;
  s.add(new THREE.Mesh(new THREE.SphereGeometry(60, 48, 24), new THREE.MeshBasicMaterial({map:tex, side:THREE.BackSide})));
  const box = (w,h,p,rot,pow=7) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));
    m.material.color.setScalar(pow); m.position.set(...p); m.lookAt(0,0,0); s.add(m);
  };
  box(50,22,[0,45,0],0,3.5);    // góra
  box(10,36,[-48,12,10],0,3);   // lewy
  box(10,36,[48,12,14],0,3);    // prawy
  box(34,7,[0,8,50],0,2.5);     // przód – pasek
  box(26,8,[-10,14,-50],0,3);   // tył
  return s;
}
scene.environment = pmrem.fromScene(studio(), 0.02).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 400);
const TARGET = new THREE.Vector3(-8, 16, 0);
camera.position.set(46, 34, 64);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.minDistance = 12;
controls.maxDistance = 140;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.update();
if(location.search.includes('debug')) window.__v = {camera, controls};   // podgląd testowy

// ---- światło ----
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(26, 50, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-30, right:30, top:40, bottom:-20, near:1, far:140});
sun.shadow.bias = -0.0004;
sun.shadow.radius = 5;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xdfe8ff, 2.0);             // światło konturowe od tyłu
rim.position.set(-30, 30, -40); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xffffff, 1.0);
rim2.position.set(35, 10, -30); scene.add(rim2);

// ---- materiały ----

const satin  = new THREE.MeshStandardMaterial({color:0xdfe1e4, metalness:1, roughness:0.28, envMapIntensity:1.0});
const dark   = new THREE.MeshStandardMaterial({color:0x2a2c2f, metalness:0.2, roughness:0.55});

// ---- model producenta: apala.obj (metry, Y w górę), grupy base / spout / sleeve ----
const gum = new THREE.MeshStandardMaterial({color:0x2f3032, metalness:0.1, roughness:0.65});   // wkładki perlatorów
const MAT = {Chrome:chrome, Dark:dark, Gum:gum};
const S = 100;                                     // metry → jednostki sceny (cm)
const BODY_Y = 0.070;                              // oś korpusu (m)
const faucet = new THREE.Group(); faucet.scale.setScalar(S); scene.add(faucet);   // eksportowany do GLB
const swing = new THREE.Group(); faucet.add(swing);                               // wylewka – obrót wokół kolumny
const SPOUT0 = -Math.PI/2;                         // pozycja wyjściowa: wylewka w lewo, jak na zdjęciu
swing.rotation.y = SPOUT0;
const capG = new THREE.Group(); capG.position.y = BODY_Y; faucet.add(capG);      // tuleja z rączką – obrót wokół osi korpusu

// ---- woda (opcjonalna) – z mniejszego perlatora, obraca się razem z wylewką ----
const swc = document.createElement('canvas'); swc.width = 8; swc.height = 256;
const sctx = swc.getContext('2d');
for(let y=0;y<256;y++){ const a = 0.25 + Math.random()*0.65; sctx.fillStyle = `rgba(255,255,255,${a})`; sctx.fillRect(0,y,8,1); }
const streamTex = new THREE.CanvasTexture(swc); streamTex.wrapT = THREE.RepeatWrapping; streamTex.repeat.set(1, 5);
const AER_Y = 0.296, AER_Z = 0.189;
const stream = new THREE.Mesh(
  new THREE.CylinderGeometry(0.0011, 0.0009, AER_Y - 0.002, 16, 1, true),
  new THREE.MeshBasicMaterial({color:0xd4ebff, map:streamTex, transparent:true, opacity:0.8, depthWrite:false, side:THREE.DoubleSide}));
stream.position.set(0, AER_Y/2, AER_Z); stream.visible = false;
swing.add(stream);

const FACE_X = 0.0834, FACE_R = 0.0232;            // płaskie czoło tulei (m), oś korpusu = środek capG
function logoTexture(){
  const N = 1024, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
  const W = 0.0152;                                // szerokość logo na czole (m)
  const k = (W / (2*FACE_R)) * N / 923;            // 923 = szerokość logo w jednostkach SVG
  g.translate(N/2, N/2);                           // dokładnie na środku czoła
  g.scale(k, k); g.translate(-538, -438);          // środek logo w SVG
  g.fillStyle = '#fff'; g.fill(new Path2D(LOGO_D));
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}
const engr = new THREE.MeshStandardMaterial({alphaMap:logoTexture(), transparent:true, depthWrite:false,
  metalness:0.85, roughness:0.6, polygonOffset:true, polygonOffsetFactor:-2});
const logo = new THREE.Mesh(new THREE.PlaneGeometry(2*FACE_R, 2*FACE_R), engr);
logo.rotation.y = Math.PI/2; logo.position.x = FACE_X; capG.add(logo);   // u (prawo) = -Z, v (góra) = +Y
function tick(color, w, h, u, v, angle = 0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({color, roughness:0.4, metalness:0.2, polygonOffset:true, polygonOffsetFactor:-2}));
  m.rotation.set(0, Math.PI/2, 0); m.rotateZ(angle); m.position.set(FACE_X, v, -u); capG.add(m);
}
tick(0x3f6fd0, 0.00045, 0.0033, 0, 0.0194);      // niebieski "|" dokładnie u góry – zimna
tick(0xd0444a, 0.0048, 0.00045, -0.0167, 0);    // czerwony "–" po lewej, na wysokości środka – ciepła
function engraveFor(key){                          // grawer = zmatowiony metal; na czarnym macie laser odsłania jasny metal
  if(key === 'black'){ engr.color.setHex(0x9c9a96); engr.metalness = 0.8; engr.roughness = 0.45; }
  else { engr.color.copy(chrome.color).multiplyScalar(0.72); engr.metalness = 0.85; engr.roughness = 0.6; }
}

const loading = document.getElementById('loading');
new OBJLoader().load('apala.obj', root => {
  root.traverse(o => {
    if(!o.isMesh) return;
    const [group, mat] = o.name.split('_');
    o.material = MAT[mat] || chrome;
    o.castShadow = true;
    if(group === 'spout') swing.add(o.clone());
    else if(group === 'sleeve'){ const m = o.clone(); m.position.y = -BODY_Y; capG.add(m); }
    else faucet.add(o.clone());
  });
  loading.remove();
}, undefined, err => { loading.textContent = 'Nie udało się wczytać modelu (apala.obj).'; console.error(err); });

// marmur: jasne tło, miękkie chmury i szare żyłki biegnące po skosie (generowane w canvasie)
function marbleTexture(W, H){
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#f2f1ee'; g.fillRect(0, 0, W, H);
  for(let i = 0; i < 90; i++){                                    // delikatne chmury
    const x = Math.random()*W, y = Math.random()*H, r = 60 + Math.random()*260;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const tone = Math.random() < 0.5 ? '196,193,188' : '226,223,217';
    gr.addColorStop(0, `rgba(${tone},0.12)`); gr.addColorStop(1, `rgba(${tone},0)`);
    g.fillStyle = gr; g.fillRect(x-r, y-r, 2*r, 2*r);
  }
  g.save(); g.translate(W/2, H/2); g.rotate(-0.55); g.translate(-W, -H);
  const vein = (width, alpha, color, steps) => {                  // żyłka = błądzenie losowe
    let x = Math.random()*W*2, y = Math.random()*H*0.3, ang = Math.PI/2 + (Math.random()-.5)*0.5;
    g.beginPath(); g.moveTo(x, y);
    for(let k = 0; k < steps; k++){ ang += (Math.random()-.5)*0.32; x += Math.cos(ang)*10; y += Math.sin(ang)*10; g.lineTo(x, y); }
    g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = width; g.stroke(); g.globalAlpha = 1;
  };
  g.filter = 'blur(6px)';   for(let i = 0; i < 6;  i++) vein(12 + Math.random()*14, 0.20, '#8c867d', 260);
  g.filter = 'blur(1.5px)'; for(let i = 0; i < 9;  i++) vein(2.5 + Math.random()*3,  0.65, '#77716a', 240);
  g.filter = 'blur(0.4px)'; for(let i = 0; i < 18; i++) vein(0.8 + Math.random()*1.2, 0.60, '#8b857c', 160);
  g.restore(); g.filter = 'none';
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const SW = 120, SD = 64, SH = 3;                                  // blat: szer. × głęb. × grubość (cm)
const marbleTop = marbleTexture(2048, Math.round(2048*SD/SW));
const marbleSide = marbleTop.clone(); marbleSide.wrapS = marbleSide.wrapT = THREE.RepeatWrapping; marbleSide.repeat.set(1, SH/SD);
const marbleProps = {color:0xd9d7d3, roughness:0.18, metalness:0, clearcoat:0.5, clearcoatRoughness:0.15, envMapIntensity:0.45};
const topMat  = new THREE.MeshPhysicalMaterial({map:marbleTop,  ...marbleProps});
const sideMat = new THREE.MeshPhysicalMaterial({map:marbleSide, ...marbleProps});
const slab = new THREE.Mesh(new THREE.BoxGeometry(SW, SH, SD), [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]);
slab.position.set(-8, -SH/2, 14);                                 // bateria bliżej tylnej krawędzi
slab.receiveShadow = true; scene.add(slab);
shadowCatcher.visible = false;

  document.querySelectorAll('#swatches button').forEach(b => toggle(b, b.dataset.f === key));
}
for(const [key, f] of Object.entries(FINISH)){
  const b = document.createElement('button'); b.dataset.f = key; b.title = f.name;
  const [a, m, d] = SWATCH[key];
  b.innerHTML = `<i style="background:linear-gradient(135deg,${a} 0%,${m} 45%,${d} 100%)"></i>${f.name.replace(' (Gun Metal)','')}`;
  b.onclick = () => setFinish(key);
  $('swatches').appendChild(b);
}
setFinish('chrome');
$('tilt').oninput = e => { capG.rotation.x = THREE.MathUtils.degToRad(+e.target.value); $('tlv').textContent = e.target.value + '°'; };
controls.addEventListener('start', () => { controls.autoRotate = false; toggle($('bAuto'), false); });

const VIEWS = {front:[-8,16,82], back:[-8,16,-82], right:[74,16,0], left:[-90,16,0], top:[-8,115,0.01]};
let tween = null;
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  controls.autoRotate = false; toggle($('bAuto'), false);
  const v = VIEWS[b.dataset.v];
  tween = {p0:camera.position.clone(), t0:controls.target.clone(), p1:new THREE.Vector3(...v), t1:TARGET.clone(), s:performance.now()};
});

$('bGlb').onclick = () => {
  faucet.scale.setScalar(1);                                       // GLB w metrach
  new GLTFExporter().parse(faucet, buf => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], {type:'model/gltf-binary'}));
    a.download = 'Apala_' + FINISH[finishKey].file + '.glb'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, err => console.error(err), {binary:true});
  faucet.scale.setScalar(S);
};

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  const asp = w/h;                                                 // wąski ekran – szersze pole widzenia, żeby wylewka się mieściła
  camera.fov = asp < 1 ? Math.min(80, 2*Math.atan(Math.tan(THREE.MathUtils.degToRad(16))/asp*1.05)*180/Math.PI) : 32;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

renderer.setAnimationLoop(() => {
  if(tween){
    const k = Math.min(1, (performance.now()-tween.s)/700), e = k*k*(3-2*k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if(k === 1) tween = null;
  }
  streamTex.offset.y -= 0.03;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
